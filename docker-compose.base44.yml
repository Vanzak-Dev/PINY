services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - piny_node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - CHOKIDAR_USEPOLLING=true
      - API_PROXY_TARGET=http://api:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      api:
        condition: service_healthy

  api:
    image: node:22
    working_dir: /app/server
    volumes:
      - .:/app
      - piny_api_node_modules:/app/server/node_modules
      - piny_catalog_data:/app/server/data
      - piny_product_uploads:/app/server/uploads
    environment:
      - PORT=8000
      - DATA_DIR=/app/server/data
      - UPLOAD_DIR=/app/server/uploads
    env_file:
      - /run/base44/app.env
    command: sh -c "npm install && npm run dev"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 20

volumes:
  piny_node_modules:
  piny_api_node_modules:
  piny_catalog_data:
  piny_product_uploads:
